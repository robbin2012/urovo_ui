<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120" role="img" aria-label="四个椭圆依次从零到百分之百沿路径由快到慢连续绘制的动态图标">
  <style>
    .oval {
      fill: none;
      stroke: #3b82f6;
      stroke-width: 1px;
      stroke-linecap: butt;
      stroke-linejoin: round;
      stroke-dasharray: 253.2036 253.2036;
      stroke-dashoffset: 253.2036;
      animation: draw-oval 2.4s cubic-bezier(0.18, 0.75, 0.3, 1) 1 both;
    }
    .oval:nth-child(1) { animation-delay: 0s; }
    .oval:nth-child(2) { animation-delay: 0.28s; }
    .oval:nth-child(3) { animation-delay: 0.56s; }
    .oval:nth-child(4) { animation-delay: 0.84s; }
    @keyframes draw-oval {
      from { stroke-dashoffset: 253.2036; }
      to   { stroke-dashoffset: 0; }
    }
  </style>
  <g id="ellipses">
    <path class="oval" d="M 73.6801448 60.0072420 A 13.6729028 59.2830416 0 0 1 46.3343392 60.0072420 A 13.6729028 59.2830416 0 0 1 73.6801448 60.0072420 Z" />
    <path class="oval" d="M 73.6801448 60.0072420 A 13.6729028 59.2830416 0 0 1 46.3343392 60.0072420 A 13.6729028 59.2830416 0 0 1 73.6801448 60.0072420 Z" transform="rotate(-45 60.0072420 60.0072420)" />
    <path class="oval" d="M 119.2902836 60.0072420 A 59.2830416 13.6729028 0 0 1 0.7242004 60.0072420 A 59.2830416 13.6729028 0 0 1 119.2902836 60.0072420 Z" />
    <path class="oval" d="M 119.2902836 60.0072420 A 59.2830416 13.6729028 0 0 1 0.7242004 60.0072420 A 59.2830416 13.6729028 0 0 1 119.2902836 60.0072420 Z" transform="rotate(-45 60.0072420 60.0072420)" />
  </g>
</svg>